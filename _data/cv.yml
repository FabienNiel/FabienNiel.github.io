cv:
  name: Fabien Niel
  label: Research Scientist
  email: fabien.niel10@gmail.com
  image: ""
  summary: Research scientist with experience building and evaluating foundation-model training systems at Mistral AI and developing a production ML system from first implementation through prospective multi-hospital validation at Quantiq. PhD in theoretical physics, with expertise in statistical modelling, noisy time-series data, numerical simulation, and scientific computing.

  address:
    city: Paris
    region: France

  social_networks:
    - network: LinkedIn
      username: fabien-niel
    - network: GitHub
      username: FabienNiel

  sections:
    Experience:
      - company: Mistral AI
        position: Applied Scientist
        location: Paris, France
        start_date: 2025-12-01
        end_date: 2026-05-31
        highlights:
          - Implemented the first Mixture-of-Experts support in Forge, Mistral's scalable framework for training and adapting frontier models, and contributed to DPO, expert parallelism, and distributed data loading.
          - Ported Voxtral's model architecture and audio data pipeline into Forge, debugging PyTorch/FSDP failures and integrating research implementations into reusable production workflows.
          - Designed an evidence-grounded benchmark from raw Singaporean legal documents after the original client evaluation saturated, with controls for leakage, truthfulness, distractor plausibility, and answer-length bias.

      - company: Quantiq
        position: Co-founder & CTO
        location: Paris, France
        start_date: 2020-02-01
        end_date: 2025-10-31
        highlights:
          - Built Quantiq's end-to-end camera-based physiological sensing system from scratch, extracting clean photoplethysmographic signals and estimating heart and respiratory rates in real time from commodity webcams and smartphone cameras under uncontrolled lighting, motion, and device conditions.
          - Designed the data acquisition and evaluation infrastructure for 10,000+ participants (300+ hours of synchronized video and medical-reference signals) collected across 5+ devices, 20+ environments, and six hospitals.
          - Identified severe overestimation from session-level validation by enforcing patient-disjoint splits, then introduced quality-control models and prospective clinical evaluation to measure true out-of-distribution performance.
          - Developed transformer and CNN-based models for physiological time series, including self-supervised pretraining, multitask fine-tuning, architecture search, and systematic hyperparameter evaluation.
          - Brought the system from first implementation to a CE-marked production medical device, leading technical direction across an eight-person team; achieved prospective RMSEs of 3.1 bpm for heart rate and 2.9 breaths/min for respiratory rate.

      - company: CNRS / École Polytechnique
        position: PhD Researcher (2015–2018) and Postdoctoral Fellow (2018–2019)
        location: Paris, France
        start_date: 2015
        end_date: 2019
        summary: Visiting PhD Researcher, Max Planck Institute for Nuclear Physics, Heidelberg, Germany (2017).
        highlights:
          - Developed mathematical and numerical models of stochastic radiation reaction in strong electromagnetic fields, connecting quantum emission dynamics to classical and kinetic descriptions and establishing their domains of validity.
          - Derived observable signatures of radiation reaction and strong-field QED cascades in particle and photon distributions, validating analytical predictions through numerical simulation.
          - Extended this work to nonlinear Breit–Wheeler pair creation in structured laser fields; PhD thesis selected for Springer's Outstanding PhD Thesis series.

